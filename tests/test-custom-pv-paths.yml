name: Test custom PV loop paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lvm2 || true

      - name: Create mount point
        run: sudo mkdir -p /build

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '2048'
          temp-reserve-mb: '200'
          swap-size-mb: '1024'
          build-mount-path: '/build'
          pv-loop-path: '/custom-pv.img'
          tmp-pv-loop-path: '/mnt/custom-tmp-pv.img'

      - name: Assert action ran with custom PV paths (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying custom PV image files..."

            if [ ! -f /custom-pv.img ]; then
              echo "FAIL: /custom-pv.img not found"
              exit 1
            fi
            echo "PASS: /custom-pv.img exists"

            if [ ! -f /mnt/custom-tmp-pv.img ]; then
              echo "FAIL: /mnt/custom-tmp-pv.img not found"
              exit 1
            fi
            echo "PASS: /mnt/custom-tmp-pv.img exists"

            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point"
              exit 1
            fi
            echo "PASS: /build is a mount point"

            if ! sudo vgs buildvg > /dev/null 2>&1; then
              echo "FAIL: LVM volume group 'buildvg' not found"
              exit 1
            fi
            echo "PASS: LVM volume group 'buildvg' exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loop device operations not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
