name: Test overprovision LVM option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lvm2 || true

      - name: Create mount point
        run: sudo mkdir -p /build

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '2048'
          temp-reserve-mb: '200'
          swap-size-mb: '1024'
          overprovision-lvm: 'true'
          build-mount-path: '/build'

      - name: Assert action ran with overprovision LVM (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying LVM logical volumes..."

            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point"
              exit 1
            fi
            echo "PASS: /build is a mount point"

            if ! touch /build/test-file; then
              echo "FAIL: /build is not writable"
              exit 1
            fi
            rm -f /build/test-file
            echo "PASS: /build is writable"

            if ! sudo lvs buildvg/buildlv > /dev/null 2>&1; then
              echo "FAIL: LVM logical volume 'buildvg/buildlv' not found"
              exit 1
            fi
            echo "PASS: LVM logical volume 'buildvg/buildlv' exists"

            if ! sudo lvs buildvg/swap > /dev/null 2>&1; then
              echo "FAIL: LVM logical volume 'buildvg/swap' not found"
              exit 1
            fi
            echo "PASS: LVM logical volume 'buildvg/swap' exists"

            echo "Disk space after overprovision LVM setup:"
            df -h
            echo "PASS: disk space report completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loop device operations not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
