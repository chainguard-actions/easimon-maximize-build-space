name: Test overprovision LVM option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check environment
        run: |
          echo "Disk space before:"
          df -h
          echo "Memory and swap:"
          free

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          overprovision-lvm: 'true'
          build-mount-path: '/build'
          build-mount-path-ownership: 'runner:runner'

      - name: Assert action ran (succeeded or failed gracefully on unsupported environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying overprovision LVM setup..."

            echo "Checking /build mount point..."
            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point"
              df -h
              exit 1
            fi
            echo "PASS: /build is a mount point"
            df -h /build

            echo "Checking LVM logical volumes..."
            if ! sudo lvs buildvg/buildlv > /dev/null 2>&1; then
              echo "FAIL: LVM logical volume 'buildvg/buildlv' not found"
              sudo lvs || true
              exit 1
            fi
            echo "PASS: LVM logical volume 'buildvg/buildlv' exists"
            sudo lvs buildvg

            echo "Checking swap LV..."
            if ! sudo lvs buildvg/swap > /dev/null 2>&1; then
              echo "FAIL: LVM logical volume 'buildvg/swap' not found"
              sudo lvs || true
              exit 1
            fi
            echo "PASS: LVM logical volume 'buildvg/swap' exists"

            echo "Testing write to /build..."
            echo "overprovision test" > /build/test-file.txt
            CONTENT=$(cat /build/test-file.txt)
            echo "Content: $CONTENT"
            if [ "$CONTENT" != "overprovision test" ]; then
              echo "FAIL: file content mismatch"
              exit 1
            fi
            echo "PASS: /build is writable with overprovision-lvm=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loopback not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
