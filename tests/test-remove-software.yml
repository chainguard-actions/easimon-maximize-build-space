name: Test remove software options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record pre-action state
        run: |
          echo "Disk space before:"
          df -h
          echo "Checking for dotnet directory:"
          ls /usr/share/dotnet 2>/dev/null && echo "dotnet dir exists" || echo "dotnet dir not found"
          echo "Checking for android directory:"
          ls /usr/local/lib/android 2>/dev/null && echo "android dir exists" || echo "android dir not found"
          echo "Checking for haskell directory:"
          ls /opt/ghc 2>/dev/null && echo "ghc dir exists" || echo "ghc dir not found"

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          build-mount-path: '/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Assert action ran (succeeded or failed gracefully on unsupported environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action removes software BEFORE attempting LVM setup.
          # So even if LVM fails, the software removal should have happened.
          # We check that the directories are gone regardless of outcome.

          echo "Checking /usr/share/dotnet..."
          if [ -d /usr/share/dotnet ]; then
            echo "FAIL: /usr/share/dotnet still exists after remove-dotnet=true"
            exit 1
          fi
          echo "PASS: /usr/share/dotnet was removed (or was not present)"

          echo "Checking /usr/local/lib/android..."
          if [ -d /usr/local/lib/android ]; then
            echo "FAIL: /usr/local/lib/android still exists after remove-android=true"
            exit 1
          fi
          echo "PASS: /usr/local/lib/android was removed (or was not present)"

          echo "Checking /opt/ghc..."
          if [ -d /opt/ghc ]; then
            echo "FAIL: /opt/ghc still exists after remove-haskell=true"
            exit 1
          fi
          echo "PASS: /opt/ghc was removed (or was not present)"

          if [ "$OUTCOME" = "success" ]; then
            echo "Action fully succeeded — verifying mount point..."
            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point after successful action"
              df -h
              exit 1
            fi
            echo "PASS: /build is a mount point"
            df -h /build
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: LVM setup failed gracefully (not supported in this environment), but software removal succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
