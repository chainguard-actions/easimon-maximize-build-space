name: Test software removal flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record pre-action state
        run: |
          echo "=== Pre-action software directories ==="
          echo "dotnet: $(ls /usr/share/dotnet 2>/dev/null && echo 'exists' || echo 'not found')"
          echo "android: $(ls /usr/local/lib/android 2>/dev/null && echo 'exists' || echo 'not found')"
          echo "haskell: $(ls /opt/ghc 2>/dev/null && echo 'exists' || echo 'not found')"
          echo "codeql: $(ls /opt/hostedtoolcache/CodeQL 2>/dev/null && echo 'exists' || echo 'not found')"

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '512'
          build-mount-path: '/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Assert action ran (success or graceful failure in container)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying software removal..."

            if [ -d /usr/share/dotnet ]; then
              echo "FAIL: /usr/share/dotnet still exists after remove-dotnet=true"
              exit 1
            fi
            echo "PASS: /usr/share/dotnet is removed (or was never present)"

            if [ -d /usr/local/lib/android ]; then
              echo "FAIL: /usr/local/lib/android still exists after remove-android=true"
              exit 1
            fi
            echo "PASS: /usr/local/lib/android is removed (or was never present)"

            if [ -d /opt/ghc ]; then
              echo "FAIL: /opt/ghc still exists after remove-haskell=true"
              exit 1
            fi
            echo "PASS: /opt/ghc is removed (or was never present)"

            if [ -d /opt/hostedtoolcache/CodeQL ]; then
              echo "FAIL: /opt/hostedtoolcache/CodeQL still exists after remove-codeql=true"
              exit 1
            fi
            echo "PASS: /opt/hostedtoolcache/CodeQL is removed (or was never present)"

            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point"
              exit 1
            fi
            echo "PASS: /build is a mount point"
            df -h /build

          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loop devices not available in container environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
