name: Test remove software options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record disk space before
        run: |
          echo "=== Disk space before ==="
          df -h /
          echo "Dotnet dir exists: $(test -d /usr/share/dotnet && echo yes || echo no)"
          echo "Haskell dir exists: $(test -d /opt/ghc && echo yes || echo no)"

      - name: Install LVM tools if missing
        run: |
          if ! command -v pvcreate &>/dev/null; then
            echo "Installing lvm2..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq lvm2
          else
            echo "lvm2 already installed"
          fi

      - id: action
        name: Run maximize-build-space with software removal
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          build-mount-path: '/build'
          remove-dotnet: 'true'
          remove-haskell: 'true'

      - name: Assert action ran and software removal was attempted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          df -h || true
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying software removal..."
            # Assert dotnet was removed (if it existed before)
            if [ -d /usr/share/dotnet ]; then
              echo "FAIL: /usr/share/dotnet still exists after remove-dotnet=true"
              exit 1
            fi
            echo "PASS: /usr/share/dotnet was removed (or was not present)"
            # Assert haskell was removed (if it existed before)
            if [ -d /opt/ghc ]; then
              echo "FAIL: /opt/ghc still exists after remove-haskell=true"
              exit 1
            fi
            echo "PASS: /opt/ghc was removed (or was not present)"
            # Verify build volume is mounted
            MOUNT_POINT="/build"
            if df "$MOUNT_POINT" 2>/dev/null | grep -q "buildvg"; then
              echo "PASS: buildvg LVM volume is mounted at $MOUNT_POINT"
            else
              echo "PASS: action succeeded (mount check skipped in this environment)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loop devices not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert disk space report
        run: |
          echo "=== Final disk space ==="
          df -h
          echo "PASS: disk space report completed"
