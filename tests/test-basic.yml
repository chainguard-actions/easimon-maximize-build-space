name: Test basic usage - default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lvm2

      - name: Run action with default inputs
        id: action
        uses: .
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'

      - name: Assert build volume is mounted at GITHUB_WORKSPACE
        run: |
          echo "Checking that GITHUB_WORKSPACE is a mount point..."
          if ! mountpoint -q "$GITHUB_WORKSPACE"; then
            echo "FAIL: $GITHUB_WORKSPACE is not a mount point"
            df -h
            exit 1
          fi
          echo "PASS: $GITHUB_WORKSPACE is a mount point"

      - name: Assert swap is active
        run: |
          echo "Checking swap is active..."
          SWAP_LINES=$(swapon --show | wc -l)
          echo "Swap lines: $SWAP_LINES"
          if [ "$SWAP_LINES" -lt 2 ]; then
            echo "FAIL: No active swap found"
            swapon --show
            exit 1
          fi
          echo "PASS: Swap is active"

      - name: Assert disk space report
        run: |
          echo "Disk space after action:"
          df -h
          echo "PASS: Disk space report completed"
