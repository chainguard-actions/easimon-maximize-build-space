name: Test basic usage - default parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-action disk report
        run: |
          echo "=== Before action ==="
          df -h
          free -h

      - id: action
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          build-mount-path: '/build'

      - name: Assert action ran (success or graceful failure in container)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying mount point..."
            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point after successful action"
              exit 1
            fi
            echo "PASS: /build is a mount point"

            # Verify it's writable
            if ! touch /build/test-write-$$; then
              echo "FAIL: /build is not writable"
              exit 1
            fi
            rm -f /build/test-write-$$
            echo "PASS: /build is writable"

            # Verify swap
            SWAP_TOTAL=$(free -m | awk '/^Swap:/ {print $2}')
            echo "Swap total: ${SWAP_TOTAL} MB"
            if [ -z "$SWAP_TOTAL" ] || [ "$SWAP_TOTAL" -lt 512 ]; then
              echo "FAIL: expected swap >= 512 MB, got ${SWAP_TOTAL} MB"
              exit 1
            fi
            echo "PASS: swap is active (${SWAP_TOTAL} MB)"

            # Verify LVM VG
            if ! sudo vgs buildvg > /dev/null 2>&1; then
              echo "FAIL: LVM volume group 'buildvg' not found"
              exit 1
            fi
            echo "PASS: LVM volume group 'buildvg' exists"
            sudo vgs buildvg

          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loop devices not available in container environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Post-action disk report
        run: |
          echo "=== After action ==="
          df -h
          free -h
          sudo swapon --show || true
