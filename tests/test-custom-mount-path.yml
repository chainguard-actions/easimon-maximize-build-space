name: Test custom build-mount-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom mount directory
        run: |
          sudo mkdir -p /build
          echo "Created /build directory"

      - id: action
        uses: .
        with:
          build-mount-path: '/build'
          root-reserve-mb: '1024'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          remove-dotnet: 'false'
          remove-android: 'false'
          remove-haskell: 'false'
          remove-codeql: 'false'
          remove-docker-images: 'false'

      - name: Assert build volume is mounted at custom path
        run: |
          echo "Checking that /build is on the LVM build volume..."
          DEVICE=$(df --output=source /build | tail -1)
          echo "Device for /build: $DEVICE"
          if [[ "$DEVICE" != *"buildlv"* && "$DEVICE" != *"buildvg"* ]]; then
            echo "FAIL: expected /build to be on LVM buildlv, got: $DEVICE"
            exit 1
          fi
          echo "PASS: /build is on LVM build volume ($DEVICE)"

      - name: Assert GITHUB_WORKSPACE is NOT on the build volume
        run: |
          echo "Checking that GITHUB_WORKSPACE is NOT on the LVM build volume..."
          DEVICE=$(df --output=source "$GITHUB_WORKSPACE" | tail -1)
          echo "Device for GITHUB_WORKSPACE: $DEVICE"
          if [[ "$DEVICE" == *"buildlv"* ]]; then
            echo "FAIL: GITHUB_WORKSPACE should not be on LVM buildlv when custom mount path is set"
            exit 1
          fi
          echo "PASS: GITHUB_WORKSPACE is on its own volume ($DEVICE), not the build volume"

      - name: Assert build path is writable
        run: |
          echo "Checking that /build is writable..."
          touch /build/test-file
          if [ ! -f /build/test-file ]; then
            echo "FAIL: could not write to /build"
            exit 1
          fi
          echo "PASS: /build is writable"
