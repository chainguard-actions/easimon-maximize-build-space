name: Test custom build-mount-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          build-mount-path: /build
          build-mount-path-ownership: root:root
          root-reserve-mb: '1024'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
      - name: Assert custom mount path exists and is mounted
        run: |
          echo "Checking /build mount point..."
          if ! mountpoint -q /build; then
            echo "FAIL: /build is not a mount point"
            df -h
            exit 1
          fi
          echo "PASS: /build is a mount point"
      - name: Assert custom mount path is writable
        run: |
          echo "Checking /build is writable..."
          sudo touch /build/test-write-check
          if [ ! -f /build/test-write-check ]; then
            echo "FAIL: /build is not writable"
            exit 1
          fi
          echo "PASS: /build is writable"
      - name: Assert LVM volume group exists
        run: |
          echo "Checking LVM volume group..."
          if ! sudo vgs buildvg > /dev/null 2>&1; then
            echo "FAIL: LVM volume group 'buildvg' not found"
            exit 1
          fi
          echo "PASS: LVM volume group 'buildvg' exists"
      - name: Assert swap is active
        run: |
          echo "Checking swap..."
          SWAP_TOTAL=$(free -m | awk '/^Swap:/ {print $2}')
          echo "Swap total: ${SWAP_TOTAL} MB"
          if [ "${SWAP_TOTAL}" -lt 1 ]; then
            echo "FAIL: No swap space found"
            exit 1
          fi
          echo "PASS: Swap is active (${SWAP_TOTAL} MB)"
