name: Test custom build-mount-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom mount directory
        run: sudo mkdir -p /build

      - id: action
        name: Run maximize-build-space with custom mount path
        uses: .
        continue-on-error: true
        with:
          root-reserve-mb: '512'
          temp-reserve-mb: '100'
          swap-size-mb: '1024'
          build-mount-path: '/build'

      - name: Assert action ran and check outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          df -h
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying /build is a mount point..."
            if ! mountpoint -q /build; then
              echo "FAIL: /build is not a mount point after success"
              exit 1
            fi
            echo "Testing write to /build..."
            TEST_FILE="/build/test-write-$$.txt"
            echo "hello from test" > "$TEST_FILE"
            if [ ! -f "$TEST_FILE" ]; then
              echo "FAIL: could not write to /build"
              exit 1
            fi
            rm -f "$TEST_FILE"
            echo "Checking that /build and GITHUB_WORKSPACE are on different devices..."
            BUILD_DEV=$(df /build --output=source | tail -1)
            WS_DEV=$(df "$GITHUB_WORKSPACE" --output=source | tail -1)
            echo "Build device: $BUILD_DEV"
            echo "Workspace device: $WS_DEV"
            if [ "$BUILD_DEV" = "$WS_DEV" ]; then
              echo "FAIL: /build and GITHUB_WORKSPACE are on the same device"
              exit 1
            fi
            echo "PASS: action succeeded and /build is a separate mount"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (LVM/loopback not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
